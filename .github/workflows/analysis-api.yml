name: Analysis API checks

# The JVM half of kc's Analysis API (jvm/, docs/analysis-api.md): the JNI
# bridge's stress test, and the kc KSP backend run over the slice, Moshi,
# Dagger, Room and Hilt projects, its output compared with the recorded
# output and with stock KSP's, and detekt on kc (jvm/detekt, docs/detekt.md)
# over its fixture. The Go half's tests run in PR checks.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # The two checks run as separate jobs, side by side: both build into
  # jvm/kc-aa/build, so they can't share a checkout.
  kc-aa:
    name: KSP on kc (${{ matrix.check.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: recorded output, stock KSP
            mode: stock
          - name: KSP's test suite
            mode: ksp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The Analysis API jar (compiled from the Kotlin sources), the KSP
      # fork and the jars they need from Maven Central (and Google's Maven
      # repository, for Room): what the build
      # scripts pin, the KSP fork's commit included, so they key the cache. Maven Central
      # answers busy clients with 429s, which the scripts retry.
      - name: Cache the Analysis API jar and the KSP fork
        uses: actions/cache@v6
        with:
          path: jvm/ksp/build
          key: kc-ksp-${{ hashFiles('jvm/aa-api/build.sh', 'jvm/ksp/build.sh') }}
      # Only "stock" downloads them.
      - name: Cache the processors and stock KSP
        if: matrix.check.mode == 'stock'
        uses: actions/cache@v6
        with:
          path: jvm/kc-aa/build/m2
          key: kc-aa-m2-${{ hashFiles('jvm/kc-aa/build.sh') }}
          restore-keys: kc-aa-m2-

      - name: JNI stress test
        if: matrix.check.mode == 'stock'
        run: jvm/libkc/test.sh

      - name: ${{ matrix.check.name }}
        run: jvm/kc-aa/build.sh ${{ matrix.check.mode }}

  # A job of its own, to run alongside the KSP backend's: build.sh builds
  # kc-aa.jar and libkc.so, which kc-aa/build.sh rebuilds every run.
  detekt:
    name: detekt on kc
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Analysis API jar and the KSP fork
        uses: actions/cache@v6
        with:
          path: jvm/ksp/build
          key: kc-ksp-${{ hashFiles('jvm/aa-api/build.sh', 'jvm/ksp/build.sh') }}
      - name: Cache detekt's dependencies
        uses: actions/cache@v6
        with:
          path: jvm/detekt/build/m2
          key: kc-detekt-m2-${{ hashFiles('jvm/detekt/build.sh') }}
          restore-keys: kc-detekt-m2-

      - name: detekt on kc over its fixture
        run: jvm/detekt/build.sh test
