name: Release

# Builds kc for Linux, macOS and Windows, on amd64 and arm64, and
# smoke-tests each binary on its own platform. A pushed release tag also
# publishes the archives (.tar.gz, and .zip for Windows) and their
# SHA256SUMS as a GitHub release.
#
# A release is named <kotlin>-<n>: the Kotlin release kc is checked against
# (KOTLIN_VERSION in pr-checks.yml, which the tag must match), and kc's
# n-th release for it, such as 2.4.21-1. A suffix after that, such as
# 2.4.21-2-rc.1, makes a prerelease. Run by hand (workflow_dispatch), it
# builds and tests only, and leaves the archives as the run's artifacts.
#
# kc is pure Go (only cmd/libkc needs cgo), so one runner cross-compiles
# every platform.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+-[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
            if ! [[ $version =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[1-9][0-9]*(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag $version isn't <kotlin>-<n>[-<prerelease>], such as 2.4.21-1"
              exit 1
            fi
            kotlin=$(sed -n 's/^  KOTLIN_VERSION: *//p' .github/workflows/pr-checks.yml)
            if [ "${BASH_REMATCH[1]}" != "$kotlin" ]; then
              echo "::error::tag $version is for Kotlin ${BASH_REMATCH[1]}, but kc is checked against $kotlin (pr-checks.yml)"
              exit 1
            fi
          else
            version=dev-${GITHUB_SHA::12}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=kc_${VERSION}_${GOOS}_${GOARCH}
          exe=kc
          if [ "$GOOS" = windows ]; then exe=kc.exe; fi
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/$exe" ./cmd/kc
          cp README.md LICENSE THIRD_PARTY_NOTICES.md tools/gradle/use-kc.init.gradle.kts "dist/$name/"
          if [ "$GOOS" = windows ]; then
            archive=$name.zip
            (cd dist && zip -qr "$archive" "$name")
          else
            archive=$name.tar.gz
            tar -C dist -czf "dist/$archive" "$name"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: kc_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  # Each binary compiles and runs the README's first example on a runner of
  # its own platform.
  smoke-test:
    name: Smoke test (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { goos: darwin, goarch: arm64, runner: macos-latest }
          - { goos: windows, goarch: amd64, runner: windows-latest }
          - { goos: windows, goarch: arm64, runner: windows-11-arm }
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: testdata/run
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v6
        with:
          name: kc_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist

      - name: kc -version
        run: |
          name=kc_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = windows ]; then
            # Git Bash's tar doesn't read zip files; PowerShell does.
            pwsh -NoProfile -Command "Expand-Archive -Path dist/$name.zip -DestinationPath dist"
            kc=dist/$name/kc.exe
          else
            tar -C dist -xzf "dist/$name.tar.gz"
            kc=dist/$name/kc
          fi
          echo "KC=$kc" >> "$GITHUB_ENV"
          out=$("$kc" -version)
          echo "$out"
          case "$out" in
            "kc $VERSION "*" ${{ matrix.goos }}/${{ matrix.goarch }}") ;;
            *) echo "::error::unexpected version: $out"; exit 1 ;;
          esac

      # On Windows, println ends lines with \r\n and the checkout may have
      # converted the .kt and .out files to CRLF; the comparison ignores \r.
      - name: Compile and run fizzBuzz
        run: |
          "$KC" -d "$RUNNER_TEMP/out" testdata/run/fizzBuzz.kt
          java -cp "$RUNNER_TEMP/out" FizzBuzzKt | tr -d '\r' | diff - <(tr -d '\r' < testdata/run/fizzBuzz.out)

  publish:
    name: Publish the release
    needs: [build, smoke-test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: kc_*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum kc_*.tar.gz kc_*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if ! [[ $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/kc_*.tar.gz dist/kc_*.zip dist/SHA256SUMS \
            --verify-tag --title "kc $TAG" --generate-notes "${flags[@]}"
