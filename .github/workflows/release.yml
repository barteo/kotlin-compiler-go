name: Release

# Builds kc for Linux and macOS, on amd64 and arm64, and smoke-tests each
# binary on its own platform. A pushed release tag also publishes the
# archives and their SHA256SUMS as a GitHub release.
#
# A release is named <kotlin>-<n>: the Kotlin release kc is checked against
# (KOTLIN_VERSION in pr-checks.yml, which the tag must match), and kc's
# n-th release for it, such as 2.4.21-1. A suffix after that, such as
# 2.4.21-2-rc.1, makes a prerelease. Run by hand (workflow_dispatch), it
# builds and tests only, and leaves the archives as the run's artifacts.
#
# kc is pure Go (only cmd/libkc needs cgo), so one runner cross-compiles
# every platform.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+-[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
            if ! [[ $version =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[1-9][0-9]*(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag $version isn't <kotlin>-<n>[-<prerelease>], such as 2.4.21-1"
              exit 1
            fi
            kotlin=$(sed -n 's/^  KOTLIN_VERSION: *//p' .github/workflows/pr-checks.yml)
            if [ "${BASH_REMATCH[1]}" != "$kotlin" ]; then
              echo "::error::tag $version is for Kotlin ${BASH_REMATCH[1]}, but kc is checked against $kotlin (pr-checks.yml)"
              exit 1
            fi
          else
            version=dev-${GITHUB_SHA::12}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=kc_${VERSION}_${GOOS}_${GOARCH}
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/kc" ./cmd/kc
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/kc-lsp" ./cmd/kc-lsp
          mkdir -p "dist/$name/docs"
          cp docs/language-server.md "dist/$name/docs/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md tools/gradle/use-kc.init.gradle.kts "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: kc_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  # Each binary compiles and runs the README's first example on a runner of
  # its own platform.
  smoke-test:
    name: Smoke test (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { goos: darwin, goarch: arm64, runner: macos-latest }
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: testdata/run
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v6
        with:
          name: kc_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist

      - name: kc -version
        run: |
          tar -C dist -xzf "dist/kc_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          kc=dist/kc_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}/kc
          echo "KC=$kc" >> "$GITHUB_ENV"
          out=$("$kc" -version)
          echo "$out"
          case "$out" in
            "kc $VERSION "*" ${{ matrix.goos }}/${{ matrix.goarch }}") ;;
            *) echo "::error::unexpected version: $out"; exit 1 ;;
          esac

      - name: Open a Kotlin document over stdio without a JVM
        run: |
          server="${KC%/*}/kc-lsp"
          test "$(PATH=/nonexistent "$server" -version)" = "kc-lsp $VERSION"
          python3 - "$server" <<'PYTHON'
          import io
          import json
          import os
          import subprocess
          import sys

          doc = {"uri": "file:///Example.kt"}
          requests = [
              {"id": 1, "method": "initialize", "params": {"capabilities": {}}},
              {"method": "initialized", "params": {}},
              {"method": "textDocument/didOpen", "params": {"textDocument": {
                  **doc, "languageId": "kotlin", "version": 1, "text": "val answer: Int = 42"}}},
              {"id": 2, "method": "textDocument/hover", "params": {
                  "textDocument": doc, "position": {"line": 0, "character": 6}}},
              {"id": 3, "method": "shutdown", "params": None},
              {"method": "exit"},
          ]
          frames = bytearray()
          for request in requests:
              body = json.dumps({"jsonrpc": "2.0", **request}).encode()
              frames.extend(f"Content-Length: {len(body)}\r\n\r\n".encode() + body)
          env = dict(os.environ, PATH="/nonexistent", JAVA_HOME="", KOTLIN_HOME="")
          result = subprocess.run([sys.argv[1], "--stdio"], input=frames, stdout=subprocess.PIPE,
                                  env=env, timeout=30, check=True)
          stream = io.BytesIO(result.stdout)
          responses = {}
          while header := stream.readline():
              size = int(header.split(b":", 1)[1])
              assert stream.readline() == b"\r\n"
              msg = json.loads(stream.read(size))
              if "id" in msg:
                  responses[msg["id"]] = msg["result"]
          assert "answer" in responses[2]["contents"]["value"]
          assert responses[3] is None
          PYTHON

      - name: Compile and run fizzBuzz
        run: |
          "$KC" -d "$RUNNER_TEMP/out" testdata/run/fizzBuzz.kt
          java -cp "$RUNNER_TEMP/out" FizzBuzzKt | diff - testdata/run/fizzBuzz.out

  publish:
    name: Publish the release
    needs: [build, smoke-test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: kc_*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum kc_*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if ! [[ $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/kc_*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "kc $TAG" --generate-notes "${flags[@]}"
